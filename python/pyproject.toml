[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosoco-bin"
dynamic = ["version"]
description = "The cosoco constraint solver, shipped as a prebuilt executable"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilles Audemard", email = "audemard@cril.fr" }]
maintainers = [{ name = "Szczepanski Nicolas", email = "szczepanski@cril.fr" }]
keywords = ["constraint programming", "CSP", "COP", "XCSP3", "solver"]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/xcsp3team/cosoco"
Issues = "https://github.com/xcsp3team/cosoco/issues"

[project.scripts]
cosoco = "cosoco_bin:main"

[tool.setuptools]
packages = ["cosoco_bin"]

[tool.setuptools.package-data]
cosoco_bin = ["cosoco"]
