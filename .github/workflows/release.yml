name: Build and release

# Builds the static binary on each platform we ship, packs every one of them
# in a wheel, and, on a tag, attaches the lot to the GitHub release and
# publishes the wheels on PyPI.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Building on an old distribution is not what makes the Linux binary
          # portable -- being fully static is -- but it keeps the syscalls it
          # relies on modest.
          - { target: linux-x86_64, os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm }
          # macos-15-intel is what replaced the retired macos-13; should it
          # go the same way, dropping the line ships Apple Silicon only.
          - { target: macos-x86_64, os: macos-15-intel }
          - { target: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: cosoco

      # build.sh expects both dependencies as siblings of the cosoco directory.
      - uses: actions/checkout@v4
        with:
          repository: xcsp3team/XCSP3-CPP-Parser
          path: XCSP3-CPP-Parser
      - uses: actions/checkout@v4
        with:
          repository: crillab/pfactory
          path: pfactory

      - name: Install the build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake autoconf automake libtool liblzma-dev zlib1g-dev

      - name: Install the build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Build a minimal static libxml2
        run: |
          set -eu
          version=2.13.8
          sha256=277294cb33119ab71b2bc81f2f445e9bc9435b893ad15bb2cd2b0e859a0ee84a
          if [ "$RUNNER_OS" = macOS ] && [ -d /opt/homebrew/opt/libxml2 ]; then
            echo "::error::a Homebrew libxml2 is installed; CMakeLists.txt prefers it to this one"
            exit 1
          fi
          curl -sSLO "https://download.gnome.org/sources/libxml2/${version%.*}/libxml2-$version.tar.xz"
          echo "$sha256  libxml2-$version.tar.xz" | shasum -a 256 -c -
          tar xf "libxml2-$version.tar.xz"
          extra=""
          if [ "$RUNNER_OS" = macOS ]; then
            extra="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          fi
          # Everything that would leave an external symbol behind is off: the
          # XCSP3 parser links libxml2 too, without -lz, and its build is not
          # ours to fix. ICU, because the libxml2 Ubuntu ships is built
          # against it and a static link cannot satisfy that without dragging
          # in 30 MB of ICU data. HTTP, because nanohttp is the only caller
          # of getaddrinfo, which a static glibc will not serve without the
          # shared libraries back. zlib and lzma, because cosoco does not
          # read compressed instances anyway. iconv, because libxml2 handles
          # UTF-8, UTF-16 and Latin-1 on its own, which is all XCSP3 asks
          # for.
          cmake -S "libxml2-$version" -B libxml2-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/libxml2" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBXML2_WITH_ICU=OFF \
            -DLIBXML2_WITH_HTTP=OFF \
            -DLIBXML2_WITH_ZLIB=OFF \
            -DLIBXML2_WITH_LZMA=OFF \
            -DLIBXML2_WITH_ICONV=OFF \
            -DLIBXML2_WITH_MODULES=OFF \
            -DLIBXML2_WITH_PYTHON=OFF \
            -DLIBXML2_WITH_PROGRAMS=OFF \
            -DLIBXML2_WITH_TESTS=OFF \
            $extra
          cmake --build libxml2-build --target install -j 4
          # CMAKE_PREFIX_PATH rather than LibXml2_ROOT: cosoco asks for cmake
          # 3.10, which leaves CMP0074 at OLD and the latter ignored.
          echo "CMAKE_PREFIX_PATH=$HOME/libxml2" >> "$GITHUB_ENV"

      - name: Build
        working-directory: cosoco
        env:
          # pfactory builds its examples with -Werror, and clang rejects an
          # unused constant in one of them that gcc lets through. CXXFLAGS
          # comes after -Werror on the command line, so -Wno-error wins.
          # -O3 has to stay: pfactory's configure defaults CXXFLAGS to -O3
          # only when it is unset, so setting the variable here without it
          # would build pfactory unoptimised.
          CXXFLAGS: -O3 -Wno-error
        run: ./build.sh --static

      - name: Strip
        working-directory: cosoco
        run: |
          if [ "$RUNNER_OS" = Linux ]; then strip -s main/cosoco; else strip main/cosoco; fi
          ls -l main/cosoco

      - name: Check that the binary is self-contained
        working-directory: cosoco
        run: |
          file main/cosoco
          if [ "$RUNNER_OS" = Linux ]; then
            # A fully static executable has no dynamic section at all.
            if readelf -d main/cosoco 2>/dev/null | grep -q NEEDED; then
              echo "::error::the binary still depends on shared libraries"
              readelf -d main/cosoco
              exit 1
            fi
          else
            otool -L main/cosoco
            # Only the libraries that are part of macOS itself may remain.
            if otool -L main/cosoco | tail -n +2 | awk '{print $1}' |
                 grep -qvE '^(/usr/lib/|/System/Library/)'; then
              echo "::error::the binary links a library that macOS does not ship"
              exit 1
            fi
          fi

      - name: Solve an instance with it
        working-directory: cosoco
        run: |
          ./main/cosoco .github/smoke.xml -model=2 | tee out.txt
          grep -q '^s SATISFIABLE' out.txt
          grep -q '<instantiation' out.txt

      # The Linux binary is claimed to be musllinux-compatible as well as
      # manylinux, which holds only as long as it stays fully static.
      - name: Solve an instance with it, on musl
        if: runner.os == 'Linux'
        working-directory: cosoco
        run: |
          docker run --rm -v "$PWD:/cosoco" -w /cosoco alpine:3.20 \
            ./main/cosoco .github/smoke.xml -model=2 | tee out-musl.txt
          grep -q '^s SATISFIABLE' out-musl.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cosoco-${{ matrix.target }}
          path: cosoco/main/cosoco
          if-no-files-found: error

  wheels:
    name: Wheels
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: cosoco-*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade build

      - name: Take the version from the tag
        if: github.ref_type == 'tag'
        run: echo "COSOCO_BIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build one wheel per binary
        run: |
          set -eu
          # Artifacts travel through a zip, which drops the executable bit:
          # install(1) puts it back. The Linux binary gets two wheels, since
          # being static makes it run on musl systems as well.
          wheel() {
            install -m 755 "binaries/cosoco-$1/cosoco" python/cosoco_bin/cosoco
            COSOCO_BIN_PLAT="$2" python -m build --wheel --outdir dist python
          }
          wheel linux-x86_64 manylinux_2_17_x86_64
          wheel linux-x86_64 musllinux_1_1_x86_64
          wheel linux-aarch64 manylinux_2_17_aarch64
          wheel linux-aarch64 musllinux_1_1_aarch64
          wheel macos-x86_64 macosx_11_0_x86_64
          wheel macos-arm64 macosx_11_0_arm64
          ls -l dist

      - name: Install the wheel of this runner and solve an instance
        run: |
          python -m pip install dist/cosoco-*-manylinux_2_17_x86_64.whl
          cosoco .github/smoke.xml -model=2 | tee out.txt
          grep -q '^s SATISFIABLE' out.txt
          python -c "import cosoco_bin, os; assert os.access(cosoco_bin.PATH, os.X_OK), cosoco_bin.PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach the binaries and the wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The job checks nothing out, so gh has no repository to infer.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir upload
          for directory in artifacts/cosoco-*/; do
            name=$(basename "$directory")  # cosoco-linux-x86_64
            install -m 755 "$directory/cosoco" "upload/$name"
          done
          cp artifacts/wheels/*.whl upload/
          (cd upload && sha256sum -- * > SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "cosoco ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber

  pypi:
    name: PyPI
    # Dormant until the repository variable is set, so that a tag does not
    # publish before a trusted publisher is configured on PyPI.
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true'
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
